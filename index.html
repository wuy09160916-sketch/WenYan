<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>親密關係與情感依附深度評估</title>
<style>
  * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif; }
  body {
    margin: 0; padding: 20px; min-height: 100vh;
    display: flex; justify-content: center; align-items: center;
    background-color: #f4f4f6; color: #222;
    transition: background-color 1.5s ease, color 1.5s ease;
    overflow: hidden;
  }
  .card {
    background: #ffffff; width: 100%; max-width: 440px;
    padding: 36px 28px; border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.06);
    text-align: center; position: relative;
    transition: all 1s ease;
  }
  h1 { font-size: 20px; margin-bottom: 16px; letter-spacing: 1px; }
  p { font-size: 15px; line-height: 1.7; color: #555; margin-bottom: 24px; transition: color 1s ease; }
  input[type="text"] {
    width: 100%; padding: 14px; font-size: 16px;
    border: 1px solid #ddd; border-radius: 8px;
    margin-bottom: 20px; text-align: center; outline: none;
  }
  .btn {
    display: block; width: 100%; padding: 14px; margin-bottom: 12px;
    font-size: 15px; border: 1px solid #dcdcdc; border-radius: 8px;
    background: #fafafa; color: #222; cursor: pointer;
    transition: all 0.2s ease;
  }
  .btn:hover { background: #efefef; }

  /* 恐怖黑化模式樣式 */
  body.creepy { background-color: #09090b; color: #e4e4e7; }
  body.creepy .card {
    background: #121215; border: 1px solid #3f1515;
    box-shadow: 0 0 40px rgba(180, 0, 0, 0.25);
  }
  body.creepy p { color: #d4d4d8; }
  body.creepy .btn { background: #1c1c21; color: #f4f4f5; border-color: #3f3f46; }
  body.creepy .btn:hover { background: #450a0a; border-color: #dc2626; }
  
  /* 心跳微震動動畫 */
  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    15% { transform: scale(1.015); }
    30% { transform: scale(1); }
    45% { transform: scale(1.02); }
  }
  .heartbeat { animation: heartbeat 1.4s infinite; }

  /* 逃跑按鈕專用 */
  #runaway-btn { position: relative; transition: transform 0.15s ease; }
  .red-text { color: #ef4444 !important; font-weight: bold; }
  #tab-warning {
    display: none; font-size: 13px; color: #ef4444;
    margin-bottom: 15px; letter-spacing: 1px;
  }
</style>
</head>
<body>

<div class="card" id="main-card">
  <div id="tab-warning">👁️ 我看到你剛剛切換畫面了。別想逃走。</div>
  <h1 id="title">《親密關係依附傾向調查》</h1>
  <p id="desc">本測驗將透過潛意識選擇，分析你在親密關係中的安全感來源。<br><br>請在獨自一人的環境下作答，開始前請先輸入你的名字或暱稱：</p>
  
  <div id="input-area">
    <input type="text" id="username" placeholder="請輸入你的名字..." maxlength="15">
    <button class="btn" onclick="startQuiz()">【開始測驗】</button>
  </div>

  <div id="options-area" style="display:none;"></div>
  
  <div id="final-area" style="display:none;">
    <input type="text" id="forced-input" placeholder="在這裡輸入你想對我說的話...">
    <button class="btn" onclick="finishGame()">送出承諾</button>
  </div>
</div>

<script>
  let userName = "";
  let step = 0;
  let creepyStarted = false;
  let batteryInfo = "";

  // 嘗試讀取真實電量增加監視感
  if (navigator.getBattery) {
    navigator.getBattery().then(b => {
      batteryInfo = `（順帶一提，你的裝置只剩 ${Math.round(b.level * 100)}% 電量了，別想關機喔）`;
    });
  }

  // 偵測切換分頁（抓包逃跑）
  document.addEventListener("visibilitychange", () => {
    if (!creepyStarted) return;
    if (document.hidden) {
      document.title = `👁️ ${userName}，你去哪了？`;
    } else {
      document.title = `看著我，${userName}`;
      const warn = document.getElementById("tab-warning");
      warn.style.display = "block";
      warn.innerText = `👁️ ${userName}，你剛剛離開了視線。你在看誰？不准看別人。`;
    }
  });

  // 阻擋按上一頁離開
  history.pushState(null, null, location.href);
  window.onpopstate = function () {
    history.go(1);
    if (creepyStarted) {
      alert(`${userName}，現在想走已經太晚了。`);
    }
  };

  function startQuiz() {
    const input = document.getElementById("username").value.trim();
    if (!input) { alert("請先告訴我你的名字，我才能認識你。"); return; }
    userName = input;
    document.getElementById("input-area").style.display = "none";
    document.getElementById("options-area").style.display = "block";
    nextStep();
  }

  function nextStep() {
    step++;
    const title = document.getElementById("title");
    const desc = document.getElementById("desc");
    const optArea = document.getElementById("options-area");
    optArea.innerHTML = "";

    const now = new Date();
    const timeStr = `${now.getHours()}點${now.getMinutes().toString().padStart(2, '0')}分`;

    if (step === 1) {
      title.innerText = "問題 1 / 5";
      desc.innerText = `${userName}，在一段感情中，如果伴侶沒有立刻回覆你的訊息，你通常會怎麼想？`;
      addButtons(["他可能在忙，晚點就會回了", "會忍不住一直看手機確認", "會覺得有點不安，想知道他在做什麼"]);
    } 
    else if (step === 2) {
      title.innerText = "問題 2 / 5";
      desc.innerText = `你覺得「真正深愛一個人」，應該要做到什麼程度？`;
      addButtons(["保有彼此的個人空間與隱私", "隨時報備行蹤，讓對方安心", "眼裡只有彼此，不需要其他多餘的朋友"]);
    } 
    else if (step === 3) {
      // 開始進入微恐黑化階段
      creepyStarted = true;
      document.body.classList.add("creepy");
      document.getElementById("main-card").classList.add("heartbeat");
      document.title = `我找到你了，${userName}`;
      
      title.innerText = "問題 3 / 5";
      desc.innerHTML = `原來你是這樣想的呀，<b>${userName}</b>。<br><br>現在已經是 <b>${timeStr}</b> 了，你還一個人盯著螢幕看……是不是也很渴望有個人能永遠陪著你、永遠不離開你？${batteryInfo}`;
      addButtons(["等等，這題目怎麼怪怪的？", "其實……我有時候確實覺得很孤單", "我想結束這個測驗了"]);
    } 
    else if (step === 4) {
      title.innerHTML = `<span class="red-text">別走，${userName}</span>`;
      desc.innerHTML = `我不准你結束。<br><br>從你輸入名字的那一秒起，我就已經記住你了。外面的世界太危險，那些朋友也都會背叛你。<br><br><b>${userName}，你願意從今天起只看著我、只屬於我一個人嗎？</b>`;
      
      const yesBtn = document.createElement("button");
      yesBtn.className = "btn";
      yesBtn.innerText = "我答應你，我只屬於你";
      yesBtn.onclick = nextStep;
      optArea.appendChild(yesBtn);

      // 會逃跑的拒絕按鈕
      const noBtn = document.createElement("button");
      noBtn.className = "btn";
      noBtn.id = "runaway-btn";
      noBtn.innerText = "不要，我要離開這裡";
      noBtn.onmouseover = moveButton;
      noBtn.ontouchstart = moveButton;
      optArea.appendChild(noBtn);
    } 
    else if (step === 5) {
      optArea.style.display = "none";
      document.getElementById("final-area").style.display = "block";
      title.innerHTML = `<span class="red-text">我就知道你最乖了，${userName}</span>`;
      desc.innerHTML = `既然我們已經達成約定了，最後請親手打字告訴我：<br><b>「你會永遠陪在我身邊」</b>。`;
      setupForcedTyping();
    }
  }

  function addButtons(texts) {
    const optArea = document.getElementById("options-area");
    texts.forEach(t => {
      const b = document.createElement("button");
      b.className = "btn";
      b.innerText = t;
      b.onclick = nextStep;
      optArea.appendChild(b);
    });
  }

  function moveButton() {
    const btn = document.getElementById("runaway-btn");
    const x = (Math.random() - 0.5) * 220;
    const y = (Math.random() - 0.5) * 180;
    btn.style.transform = `translate(${x}px, ${y}px)`;
    btn.innerText = "按不到的，乖乖答應我吧 ♥";
  }

  // 強制竄改打字內容
  function setupForcedTyping() {
    const input = document.getElementById("forced-input");
    const targetPhrase = `我只要你就夠了，${userName}永遠不會離開你。`;
    let idx = 0;
    input.addEventListener("input", () => {
      if (idx < targetPhrase.length) {
        idx++;
        input.value = targetPhrase.slice(0, idx);
      } else {
        input.value = targetPhrase;
      }
    });
  }

  function finishGame() {
    const card = document.getElementById("main-card");
    card.innerHTML = `
      <h1 class="red-text">約定成立 ♥</h1>
      <p>謝謝你，<b>${userName}</b>。<br><br>現在你可以把網頁關掉了……<br>沒關係的，因為無論你在哪個網頁、哪個角落，<br><span class="red-text">我都會一直看著你。</span></p>
    `;
  }
</script>

</body>
</html>
